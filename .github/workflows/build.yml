name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          BIN_NAME=dedsec
          TARGET=${{ matrix.target }}
          OUT_DIR=target/$TARGET/release

          if [[ "$TARGET" == *windows* ]]; then
            mv $OUT_DIR/$BIN_NAME.exe $OUT_DIR/$BIN_NAME-$TARGET.exe
          else
            mv $OUT_DIR/$BIN_NAME $OUT_DIR/$BIN_NAME-$TARGET
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dedsec*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required permission

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create/update tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ inputs.version }}
          message: ${{ inputs.version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          generate_release_notes: true
          files: |
            **/binaries-*
